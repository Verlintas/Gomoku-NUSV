name: Windows Installer Builder

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (AGP requires it during configuration)
        uses: android-actions/setup-android@v3

      - name: Install WiX Toolset (required by jpackage for MSI)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:TEMP\wix.zip"
          Expand-Archive "$env:TEMP\wix.zip" -DestinationPath "$env:TEMP\wix"
          echo "$env:TEMP\wix" >> $env:GITHUB_PATH

      - name: Build MSI installer
        shell: cmd
        run: |
          call gradlew.bat :composeApp:packageMsi --no-daemon --console=plain
          dir /s /b composeApp\build\compose\binaries\main\msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-NUSV-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" composeApp/build/compose/binaries/main/msi/*.msi --clobber
